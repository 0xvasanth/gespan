name: Gespan Native Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every PR runs this workflow: its jobs are required checks on main, and a
  # path filter would leave them unreported. Unaffected jobs skip their steps
  # instead; see scripts/ci-impact.mjs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.impact.outputs.core }}
      desktop: ${{ steps.impact.outputs.desktop }}
      host: ${{ steps.impact.outputs.host }}
      mobile: ${{ steps.impact.outputs.mobile }}
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: impact
        run: node scripts/ci-impact.mjs

  core:
    name: Core (${{ matrix.os }})
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.core != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: env.RUN == 'true' && runner.os == 'Linux'
        name: Install Linux core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev libasound2-dev pkg-config
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            crates/gespan-gpui -> target
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache deletes this folder's files but keeps its folders. A rebuilt
      # sherpa-onnx-sys then trusts the empty lib folder instead of downloading.
      - if: env.RUN == 'true'
        name: Drop the emptied sherpa-onnx folder
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt crates/gespan-gpui/target/sherpa-onnx-prebuilt
      - if: env.RUN == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The tests' databases live in temp. On C: each flush takes about 4 ms,
      # on D: about 0.3 ms, and the tests commit thousands of times.
      - if: env.RUN == 'true' && runner.os == 'Windows'
        name: Keep temp on the fast disk
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - if: env.RUN == 'true'
        run: bun run native:test:dev
      - if: env.RUN == 'true'
        run: cargo clippy --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core --all-targets --profile native-dev -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core --profile native-dev
      # The crates Native shares with the mobile link are root-workspace
      # members, so they run there.
      - if: env.RUN == 'true'
        name: Shared crates
        shell: bash
        run: |
          set -euo pipefail
          SHARED=(-p gespan-mobile-link -p gespan-keep-awake -p gespan-redact -p gespan-mcp-config -p gespan-tracker-secrets -p gespan-tracker-client -p gespan-board-store -p gespan-models -p gespan-speech)
          cargo fmt --check "${SHARED[@]}"
          cargo clippy --locked "${SHARED[@]}" --all-targets -- -D warnings
          cargo test --locked "${SHARED[@]}"

  desktop:
    name: Gespan Native (${{ matrix.name }})
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.desktop != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The same GUI dependencies the release build installs.
      - if: env.RUN == 'true' && runner.os == 'Linux'
        name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: crates/gespan-gpui -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache deletes this folder's files but keeps its folders. A rebuilt
      # sherpa-onnx-sys then trusts the empty lib folder instead of downloading.
      - if: env.RUN == 'true'
        name: Drop the emptied sherpa-onnx folder
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt crates/gespan-gpui/target/sherpa-onnx-prebuilt
      - if: env.RUN == 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      # The tests' databases live in temp. On C: each flush takes about 4 ms,
      # on D: about 0.3 ms, and the tests commit thousands of times.
      - if: env.RUN == 'true' && runner.os == 'Windows'
        name: Keep temp on the fast disk
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - if: env.RUN == 'true'
        run: cargo fmt --manifest-path crates/gespan-gpui/Cargo.toml --all --check
      - if: env.RUN == 'true'
        run: cargo clippy --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core -p gespan-gpui -p gespan-first-launch --all-targets --profile native-dev -- -D warnings
      # gespan-core's tests run in the Core job on the same OS. Each GUI test
      # gets its own process, which isolates rendering state while they run in
      # parallel. See crates/gespan-gpui/.config/nextest.toml.
      - if: env.RUN == 'true'
        run: cargo nextest run --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-gpui --cargo-profile native-dev --profile ci --config crates/gespan-gpui/.config/ci-cargo.toml
      # Not redundant: the tests enable gpui's test-support feature, so this is
      # the only step that builds what ships.
      - if: env.RUN == 'true'
        run: cargo build --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-gpui --profile native-dev --config crates/gespan-gpui/.config/ci-cargo.toml
      - if: env.RUN == 'true'
        run: cargo test --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-first-launch --profile native-dev

