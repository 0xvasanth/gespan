name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every PR runs this workflow: its jobs are required checks on main, and a
  # path filter would leave them unreported. Unaffected jobs skip their steps
  # instead; see scripts/ci-impact.mjs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Gespan ships Gespan Native and the mobile app. A job the change can't affect
# does nothing; see scripts/ci-impact.mjs.
jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.impact.outputs.core }}
      desktop: ${{ steps.impact.outputs.desktop }}
      host: ${{ steps.impact.outputs.host }}
      mobile: ${{ steps.impact.outputs.mobile }}
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: impact
        run: node scripts/ci-impact.mjs

  release-channel:
    name: Release channel isolation
    needs: impact
    if: ${{ !cancelled() && needs.impact.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test scripts/ci-impact.test.mjs scripts/release-channel.test.cjs scripts/desktop-release.test.mjs scripts/package.test.mjs scripts/fetch-sherpa-onnx.test.mjs scripts/readme-release.test.mjs

  mobile:
    name: Mobile checks
    needs: impact
    if: ${{ !cancelled() && needs.impact.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - run: bun run lint
        working-directory: mobile
      - run: bunx tsc --noEmit
        working-directory: mobile
      - run: bunx vitest run --config mobile/vitest.config.ts
      # The Android JNI entry point is behind cfg(target_os = "android"), so no
      # other job compiles it; a broken one used to surface only in the EAS
      # release build. Uses the NDK the runner image ships.
      - name: Android native link compiles
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rustup target add aarch64-linux-android
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked -p gespan-mobile-link --target aarch64-linux-android

  host:
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.host != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: env.RUN == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: env.RUN == 'true'
        run: bun install --frozen-lockfile
      - if: env.RUN == 'true'
        run: bun run test:host
      - if: env.RUN == 'true'
        run: bun run host:package

  core:
    name: Core (${{ matrix.os }})
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.core != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: env.RUN == 'true' && runner.os == 'Linux'
        name: Install Linux core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev libasound2-dev pkg-config
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            crates/gespan-gpui -> target
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache deletes this folder's files but keeps its folders. A rebuilt
      # sherpa-onnx-sys then trusts the empty lib folder instead of downloading.
      - if: env.RUN == 'true'
        name: Drop the emptied sherpa-onnx folder
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt crates/gespan-gpui/target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys downloads its libraries once from a link that can 504
      # for hours; this fetches them through the API, with retries, instead.
      - if: env.RUN == 'true'
        name: Fetch the sherpa-onnx libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fetch-sherpa-onnx.mjs --out "$RUNNER_TEMP/sherpa-onnx" --target "$(rustc -vV | sed -n 's/^host: //p')"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-onnx" >> "$GITHUB_ENV"
      - if: env.RUN == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The tests' databases live in temp. On C: each flush takes about 4 ms,
      # on D: about 0.3 ms, and the tests commit thousands of times.
      - if: env.RUN == 'true' && runner.os == 'Windows'
        name: Keep temp on the fast disk
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - if: env.RUN == 'true'
        run: bun run test:scripts
      - if: env.RUN == 'true'
        run: cargo clippy --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core --all-targets --profile native-dev -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core --profile native-dev
      # herdr-link's real-server tests run the pinned herdr release. Windows has
      # no herdr, and those tests are unix-only.
      - if: env.RUN == 'true' && runner.os != 'Windows'
        name: Fetch the pinned herdr
        shell: bash
        run: |
          bun run scripts/fetch-herdr.mjs --asset host --out "$RUNNER_TEMP/herdr"
          echo "HERDR_TEST_BINARY=$RUNNER_TEMP/herdr" >> "$GITHUB_ENV"
      # A real sshd on this runner and a herdr server in the default session,
      # for the SSH bridge test: key-only login, as Gespan does it.
      - if: env.RUN == 'true' && runner.os == 'Linux'
        name: Start a local sshd and herdr
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh ~/.local/bin
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          install -m 755 "$HERDR_TEST_BINARY" ~/.local/bin/herdr
          nohup ~/.local/bin/herdr server > "$RUNNER_TEMP/herdr-server.log" 2>&1 &
          # Wait through ssh for the server, the way Gespan will reach it.
          for _ in $(seq 50); do
            ssh -o BatchMode=yes localhost '"$HOME/.local/bin/herdr" --session default remote-api-bridge --check' && break
            sleep 0.2
          done
          ssh -o BatchMode=yes localhost '"$HOME/.local/bin/herdr" --session default remote-api-bridge --check'
          echo "HERDR_SSHD_TARGET=localhost" >> "$GITHUB_ENV"
      # The crates Native shares with the mobile link are root-workspace
      # members, so they run there.
      - if: env.RUN == 'true'
        name: Shared crates
        shell: bash
        run: |
          set -euo pipefail
          SHARED=(-p gespan-mobile-link -p gespan-keep-awake -p gespan-redact -p gespan-mcp-config -p mcp-hub -p gespan-tracker-secrets -p gespan-tracker-client -p gespan-board-store -p gespan-models -p gespan-speech -p herdr-link -p gespan-graph -p gespan-browser -p gespan-memory)
          cargo fmt --check "${SHARED[@]}"
          cargo clippy --locked "${SHARED[@]}" --all-targets -- -D warnings
          cargo test --locked "${SHARED[@]}"
      # The browser tools against a real, headless Chrome. The runner images
      # ship Google Chrome at these paths; where one is missing, Chrome for
      # Testing (stable) is installed instead. Each test also stops itself
      # (and its Chrome) after two minutes.
      - if: env.RUN == 'true'
        name: Browser against real Chrome
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
            Windows) chrome="C:/Program Files/Google/Chrome/Application/chrome.exe" ;;
            *) chrome=/usr/bin/google-chrome ;;
          esac
          if [ ! -f "$chrome" ]; then
            echo "No Google Chrome at $chrome; installing Chrome for Testing"
            chrome=$(bunx @puppeteer/browsers@2.6.1 install chrome@stable --path "$RUNNER_TEMP/chrome" | tail -n 1 | cut -d' ' -f2-)
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's
          # sandbox uses unless AppArmor allows them.
          if [ "$RUNNER_OS" = Linux ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          echo "Chrome: $chrome"
          # Two Chromes at a time: starting all seven at once on a small
          # runner makes the first tab miss its timeout.
          GESPAN_TEST_CHROME="$chrome" cargo test --locked -p gespan-browser --test real_browser -- --ignored --test-threads=2

  desktop:
    name: Gespan Native (${{ matrix.name }})
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.desktop != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The same GUI dependencies the release build installs.
      - if: env.RUN == 'true' && runner.os == 'Linux'
        name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: crates/gespan-gpui -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache deletes this folder's files but keeps its folders. A rebuilt
      # sherpa-onnx-sys then trusts the empty lib folder instead of downloading.
      - if: env.RUN == 'true'
        name: Drop the emptied sherpa-onnx folder
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt crates/gespan-gpui/target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys downloads its libraries once from a link that can 504
      # for hours; this fetches them through the API, with retries, instead.
      - if: env.RUN == 'true'
        name: Fetch the sherpa-onnx libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fetch-sherpa-onnx.mjs --out "$RUNNER_TEMP/sherpa-onnx" --target "$(rustc -vV | sed -n 's/^host: //p')"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-onnx" >> "$GITHUB_ENV"
      - if: env.RUN == 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      # The tests' databases live in temp. On C: each flush takes about 4 ms,
      # on D: about 0.3 ms, and the tests commit thousands of times.
      - if: env.RUN == 'true' && runner.os == 'Windows'
        name: Keep temp on the fast disk
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - if: env.RUN == 'true'
        run: cargo fmt --manifest-path crates/gespan-gpui/Cargo.toml --all --check
      - if: env.RUN == 'true'
        run: cargo clippy --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-core -p gespan-gpui -p gespan-first-launch --all-targets --profile native-dev -- -D warnings
      # gespan-core's tests run in the Core job on the same OS. Each GUI test
      # gets its own process, which isolates rendering state while they run in
      # parallel. See crates/gespan-gpui/.config/nextest.toml.
      - if: env.RUN == 'true'
        run: cargo nextest run --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-gpui --cargo-profile native-dev --profile ci --config crates/gespan-gpui/.config/ci-cargo.toml
      # Not redundant: the tests enable gpui's test-support feature, so this is
      # the only step that builds what ships.
      - if: env.RUN == 'true'
        run: cargo build --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-gpui --profile native-dev --config crates/gespan-gpui/.config/ci-cargo.toml
      - if: env.RUN == 'true'
        run: cargo test --manifest-path crates/gespan-gpui/Cargo.toml --locked -p gespan-first-launch --profile native-dev
