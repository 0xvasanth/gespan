name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Gespan ships Gespan Native and the mobile app. Native, its core and the shared
# crates are tested in native.yml. A job the change can't affect does nothing;
# see scripts/ci-impact.mjs.
jobs:
  impact:
    name: Impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.impact.outputs.core }}
      desktop: ${{ steps.impact.outputs.desktop }}
      host: ${{ steps.impact.outputs.host }}
      mobile: ${{ steps.impact.outputs.mobile }}
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: impact
        run: node scripts/ci-impact.mjs

  release-channel:
    name: Release channel isolation
    needs: impact
    if: ${{ !cancelled() && needs.impact.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test scripts/ci-impact.test.mjs scripts/release-channel.test.cjs scripts/build-rpm.test.mjs scripts/native-release.test.mjs scripts/package-native.test.mjs

  mobile:
    name: Mobile checks
    needs: impact
    if: ${{ !cancelled() && needs.impact.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - run: bun run lint
        working-directory: mobile
      - run: bunx tsc --noEmit
        working-directory: mobile
      - run: bunx vitest run --config mobile/vitest.config.ts

  host:
    needs: impact
    # Always reports: these names are required checks on main, and a job-level
    # skip would report a matrix name unexpanded. If impact fails, outputs are
    # empty, so every step runs.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.impact.outputs.host != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: env.RUN == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: env.RUN == 'true'
        run: bun install --frozen-lockfile
      - if: env.RUN == 'true'
        run: bun run test:host
      - if: env.RUN == 'true'
        run: bun run host:package
