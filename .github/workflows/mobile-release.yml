name: Mobile release
run-name: Mobile ${{ inputs.release }} ${{ inputs.platform }} ${{ github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Releases the mobile app (Expo project @gespan/gespan). Started by hand from
# the same vX.Y.Z tag as the Native preview release, so one tag ships
# both apps.
#
# "build" makes store builds on EAS with the production profile and, unless
# told not to, submits them (iOS to TestFlight, Android to Google Play).
# "update" publishes the tag's JavaScript over the air to the beta channel. An
# update only reaches builds whose native fingerprint matches, so release a
# build after any native change (native modules, app.json, Expo upgrades,
# crates/mobile-link).
#
# "apk" builds an installable Android APK with the apk profile, signed with the
# project's EAS keystore, for people outside Google Play. It goes on the draft
# of the tag's GitHub release, which the Release workflow creates.
on:
  workflow_dispatch:
    inputs:
      release:
        description: build makes store builds; update ships JavaScript over the air; apk adds an Android APK to the release
        type: choice
        options: [build, update, apk]
        default: build
      platform:
        description: Android submission needs a Google service account in EAS and one manual upload in Play Console first
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        description: Submit builds to TestFlight / Google Play
        type: boolean
        default: true
      dry_run:
        description: For apk, build it and leave the release alone
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/release-channel.cjs native-ref

  release:
    name: Release ${{ inputs.release }} (${{ inputs.platform }})
    needs: guard
    runs-on: ubuntu-latest
    # Waits for the EAS build, so a failed build or submission fails this run.
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ inputs.platform }}
      SUBMIT: ${{ inputs.submit }}
    steps:
      - name: Require an Expo access token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret from an Expo account with access to the @gespan/gespan project." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The same installs as the Mobile checks job; EAS reads the app config
      # and computes the fingerprint runtime version from them.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The production profile builds for the store with the beta update
      # channel and a remote, auto-incremented build number.
      - name: Build
        if: inputs.release == 'build'
        working-directory: mobile
        run: |
          args=(--platform "$PLATFORM" --profile production --non-interactive)
          if [ "$SUBMIT" = true ]; then args+=(--auto-submit); fi
          eas build "${args[@]}"
      - name: Build the APK
        if: inputs.release == 'apk'
        working-directory: mobile
        run: |
          set -euo pipefail
          eas build --platform android --profile apk --non-interactive --json > "$RUNNER_TEMP/eas-apk.json"
          url="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1]))[0].artifacts.applicationArchiveUrl' "$RUNNER_TEMP/eas-apk.json")"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/Gespan_${GITHUB_REF_NAME#v}_android.apk"
      - name: Add the APK to the draft release
        if: inputs.release == 'apk' && !inputs.dry_run
        run: |
          set -euo pipefail
          # Published files are never replaced.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
            echo "$GITHUB_REF_NAME is not a draft release." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Gespan_${GITHUB_REF_NAME#v}_android.apk" --clobber
      - name: Publish update
        if: inputs.release == 'update'
        working-directory: mobile
        run: |
          eas update --channel beta --environment production --platform "$PLATFORM" \
            --message "$GITHUB_REF_NAME" --non-interactive
