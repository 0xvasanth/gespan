name: Native preview release

on:
  # Manual only until the signing secrets exist; see "Releases and the update
  # feed" in docs/native/README.md. Start it from a native-v* tag (Run workflow
  # -> Use workflow from -> Tags -> native-vX.Y.Z-preview.N): the tag name is the
  # version, and the guard job rejects any other ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-preview-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require a native-v* tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/release-channel.cjs native-ref

  build:
    name: Native preview (${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            kind: macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            kind: macos
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            kind: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      NATIVE_UPDATER_ENDPOINT: ${{ vars.NATIVE_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rebase-gpui
          key: native-release-${{ matrix.target }}
      - name: Configure native channel and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#native-v}"
          node --input-type=module -e 'import { previewVersion } from "./scripts/package-native.mjs"; previewVersion(process.argv[1]);' "$VERSION"
          echo "REBASE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Requires TAURI_UPDATER_PUBKEY; the endpoint is the NATIVE_UPDATER_ENDPOINT repository
          # variable, or the GitHub native-latest feed when that is unset.
          node scripts/release-channel.cjs native-config
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Install native Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import existing Apple distribution credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = root / 'native-signing.p12'
          certificate.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          certificate.chmod(0o600)
          key = root / 'native-notary.p8'
          key.write_text(os.environ['APPLE_API_KEY_P8'])
          key.chmod(0o600)
          PY
          KEYCHAIN="$RUNNER_TEMP/native-signing.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/native-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/native-notary.p8" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node --test scripts/native-release.test.mjs scripts/package-native.test.mjs
      - name: Test native update backend
        run: cargo test --locked --manifest-path crates/rebase-gpui/Cargo.toml -p rebase-core --profile native-dev app_update
      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/rebase-gpui/Cargo.toml -p rebase-gpui --target ${{ matrix.target }} --release
      - name: Package native app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BINARY="crates/rebase-gpui/target/${{ matrix.target }}/release/rebase-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          node scripts/package-native.mjs '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native-dist/*.json
            native-dist/*.dmg
            native-dist/*.tar.gz
            native-dist/*.AppImage
            native-dist/*.deb
            native-dist/*.exe
          if-no-files-found: error
      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/native-signing.p12" "$RUNNER_TEMP/native-notary.p8"

  rpm:
    name: Native preview (Enterprise Linux rpm)
    needs: guard
    runs-on: ubuntu-latest
    container: almalinux:10
    env:
      CARGO_BUILD_JOBS: 2
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      NATIVE_UPDATER_ENDPOINT: ${{ vars.NATIVE_UPDATER_ENDPOINT }}
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure native rpm channel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#native-v}"
          node --input-type=module -e 'import { previewVersion } from "./scripts/package-native.mjs"; previewVersion(process.argv[1]);' "$VERSION"
          echo "REBASE_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Requires TAURI_UPDATER_PUBKEY; the endpoint is the NATIVE_UPDATER_ENDPOINT repository
          # variable, or the GitHub native-latest feed when that is unset.
          node scripts/release-channel.cjs native-config
      - run: cargo test --locked --manifest-path crates/rebase-gpui/Cargo.toml -p rebase-core --profile native-dev app_update
      - run: cargo build --locked --manifest-path crates/rebase-gpui/Cargo.toml -p rebase-gpui --release
      - run: node scripts/package-native.mjs rpm crates/rebase-gpui/target/release/rebase-gpui native-dist x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-rpm
          path: |
            native-dist/*.json
            native-dist/*.rpm
          if-no-files-found: error

  publish:
    name: Publish native preview and its update feed
    needs: [build, rpm]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rebase-gpui
          key: native-publication-verifier
      - name: Decide whether the versioned release still needs its packages
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets 2>/dev/null || true)" \
            NATIVE_RELEASE_JSON="$RELEASE_JSON" \
            node scripts/release-channel.cjs native-publish-plan native-dist "$RUNNER_TEMP/native-packages.txt"
      - name: Recovery - reuse the published, already signed feed
        if: env.NATIVE_UPLOAD_PACKAGES == 'false'
        run: |
          set -euo pipefail
          # Nothing is signed here and the signing key is not in this step's
          # environment: the feed and signatures come from the published release and
          # are only checked for consistency.
          mkdir native-recovered
          gh release download "$GITHUB_REF_NAME" --dir native-recovered --pattern latest.json --pattern '*.sig'
          node scripts/release-channel.cjs native-verify-recovery native-recovered
      - name: Sign all update packages and the native manifest
        if: env.NATIVE_UPLOAD_PACKAGES == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "REBASE_NATIVE_VERSION=${GITHUB_REF_NAME#native-v}" >> "$GITHUB_ENV"
          REBASE_NATIVE_VERSION="${GITHUB_REF_NAME#native-v}" node scripts/native-release.mjs native-dist
      - name: Verify the signed feed and all packages with the native client
        if: env.NATIVE_UPLOAD_PACKAGES == 'true'
        run: cargo run --locked --manifest-path crates/rebase-gpui/Cargo.toml -p rebase-core --example verify_native_update --profile native-dev -- native-dist
      - name: Check optional R2 mirror
        run: node scripts/release-channel.cjs native-r2
      - name: Publish native preview assets
        run: |
          set -euo pipefail
          REBASE_NATIVE_VERSION="${GITHUB_REF_NAME#native-v}"
          echo "REBASE_NATIVE_VERSION=$REBASE_NATIVE_VERSION" >> "$GITHUB_ENV"
          # A published native-v* release is immutable and is never re-uploaded. When
          # it is already published, the packages stay as they are and only the
          # native-latest feed is refreshed (this lets a failed run recover).
          FEED=native-recovered/latest.json
          if [ "$NATIVE_UPLOAD_PACKAGES" = true ]; then
            FEED=native-dist/latest.json
            node --input-type=module -e 'import { readFileSync } from "node:fs"; for (const file of JSON.parse(readFileSync("native-dist/release-files.json"))) console.log(file);' > "$RUNNER_TEMP/native-files.txt"
          fi
          if [ "$NATIVE_CREATE_RELEASE" = true ]; then
            gh release create "$GITHUB_REF_NAME" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Rebase Native ${REBASE_NATIVE_VERSION}" --notes-file docs/native/preview-release-notes.md
          fi
          if [ "$NATIVE_UPLOAD_PACKAGES" = true ]; then
            FILES=()
            while IFS= read -r file; do
              FILES+=("native-dist/$file")
            done < "$RUNNER_TEMP/native-files.txt"
            # The signed feed rides along so a failed run can republish it unsigned.
            FILES+=(native-dist/latest.json)
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          fi
          # latest.json references the assets of the versioned release above, so
          # the fixed native-latest release only ever holds this one feed file.
          # Publish it after every platform asset exists.
          if ! gh release view native-latest >/dev/null 2>&1; then
            gh release create native-latest --prerelease --latest=false --target "$GITHUB_SHA" --title "Rebase Native update feed" --notes 'Update feed for Rebase Native. Contains only latest.json; packages live on the native-v* releases.'
          fi
          gh release upload native-latest "$FEED" --clobber
      - name: Mirror native preview to R2 (optional)
        if: env.R2_ENABLED == 'true' && env.NATIVE_UPLOAD_PACKAGES == 'true'
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS= read -r file; do
            aws s3 cp "native-dist/$file" "s3://${R2_BUCKET_NAME}/native-preview/${REBASE_NATIVE_VERSION}/$file" --cache-control 'public,max-age=31536000,immutable' --endpoint-url "$ENDPOINT"
          done < "$RUNNER_TEMP/native-files.txt"
          aws s3 cp native-dist/latest.json "s3://${R2_BUCKET_NAME}/native-preview/latest.json" --content-type application/json --cache-control 'no-store,max-age=0,must-revalidate' --endpoint-url "$ENDPOINT"
