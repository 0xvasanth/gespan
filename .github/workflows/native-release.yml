name: Native preview release
run-name: Desktop ${{ github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  # The Release workflow starts this from a version's tag; see "Releases and the
  # update feed" in docs/native/README.md. The tag name is the version, and the
  # guard job rejects any other ref.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and verify everything, and publish nothing"
        type: boolean
        default: false
      allow_unsigned:
        description: "Publish ad-hoc signed, unnotarized macOS packages when the Apple signing secrets are missing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-preview-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/release-channel.cjs native-ref

  build:
    name: Native preview (${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Like release.yml: AppKit draws its controls (traffic lights, menus)
          # for the SDK the app links against, and only the newest Apple
          # silicon images ship a current one, so Intel cross-compiles there.
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            kind: macos
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            kind: macos
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            kind: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      NATIVE_UPDATER_ENDPOINT: ${{ vars.NATIVE_UPDATER_ENDPOINT }}
      NATIVE_STABLE_UPDATER_ENDPOINT: ${{ vars.NATIVE_STABLE_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gespan-gpui
          key: native-release-${{ matrix.target }}
          cache-on-failure: true
      - name: Configure native channel and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module -e 'import { nativeVersion } from "./scripts/package-native.mjs"; nativeVersion(process.argv[1]);' "$VERSION"
          echo "GESPAN_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Requires TAURI_UPDATER_PUBKEY. The endpoint is the NATIVE_UPDATER_ENDPOINT repository
          # variable (NATIVE_STABLE_UPDATER_ENDPOINT for a stable tag), or the channel's GitHub
          # feed when that is unset.
          node scripts/release-channel.cjs native-config
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Install native Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import existing Apple distribution credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No Apple distribution credentials: packaging needs allow_unsigned."
            exit 0
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = root / 'native-signing.p12'
          certificate.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          certificate.chmod(0o600)
          key = root / 'native-notary.p8'
          key.write_text(os.environ['APPLE_API_KEY_P8'])
          key.chmod(0o600)
          PY
          KEYCHAIN="$RUNNER_TEMP/native-signing.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/native-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/native-notary.p8" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: node --test scripts/native-release.test.mjs scripts/package-native.test.mjs
      - name: Test native update backend
        run: cargo test --locked --manifest-path crates/gespan-gpui/Cargo.toml -p gespan-core --profile native-dev app_update
      - name: Reclaim Mac updater-test build space
        if: runner.os == 'macOS'
        run: |
          df -h .
          cargo clean --manifest-path crates/gespan-gpui/Cargo.toml --profile native-dev
          df -h .
      - name: Require a current macOS SDK
        if: runner.os == 'macOS'
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          if (( ${sdk%%.*} < 26 )); then
            echo "macOS SDK $sdk would draw pre-macOS 26 window controls" >&2
            exit 1
          fi
          # Xcode 26 ships the Metal compiler GPUI's shaders need separately.
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - name: Install Rosetta to run the Intel build while packaging
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || arch -x86_64 /usr/bin/true
      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/gespan-gpui/Cargo.toml -p gespan-gpui --target ${{ matrix.target }} --release
      - name: Use TCP for Mac notarization
        if: runner.os == 'macOS'
        run: |
          # Mac runners can drop HTTP/3 connections to Apple's ticket service.
          # Scope this workaround to the disposable runners; preserve
          # notarization, ticket validation and Gatekeeper checks.
          # https://github.com/actions/runner-images/issues/14924
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Package native app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GESPAN_ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && '1' || '' }}
        run: |
          set -euo pipefail
          BINARY="crates/gespan-gpui/target/${{ matrix.target }}/release/gespan-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          node scripts/package-native.mjs '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            native-dist/*.json
            native-dist/*.dmg
            native-dist/*.tar.gz
            native-dist/*.AppImage
            native-dist/*.deb
            native-dist/*.exe
          if-no-files-found: error
      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/native-signing.p12" "$RUNNER_TEMP/native-notary.p8"

  rpm:
    name: Native preview (Enterprise Linux rpm)
    needs: guard
    runs-on: ubuntu-latest
    container: almalinux:10
    env:
      CARGO_BUILD_JOBS: 2
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      NATIVE_UPDATER_ENDPOINT: ${{ vars.NATIVE_UPDATER_ENDPOINT }}
      NATIVE_STABLE_UPDATER_ENDPOINT: ${{ vars.NATIVE_STABLE_UPDATER_ENDPOINT }}
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure native rpm channel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module -e 'import { nativeVersion } from "./scripts/package-native.mjs"; nativeVersion(process.argv[1]);' "$VERSION"
          echo "GESPAN_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Requires TAURI_UPDATER_PUBKEY. The endpoint is the NATIVE_UPDATER_ENDPOINT repository
          # variable (NATIVE_STABLE_UPDATER_ENDPOINT for a stable tag), or the channel's GitHub
          # feed when that is unset.
          node scripts/release-channel.cjs native-config
      - run: cargo test --locked --manifest-path crates/gespan-gpui/Cargo.toml -p gespan-core --profile native-dev app_update
      - run: cargo build --locked --manifest-path crates/gespan-gpui/Cargo.toml -p gespan-gpui --release
      - run: node scripts/package-native.mjs rpm crates/gespan-gpui/target/release/gespan-gpui native-dist x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-rpm
          path: |
            native-dist/*.json
            native-dist/*.rpm
          if-no-files-found: error

  host:
    # Gespan Native's SSH remotes download these from the vX.Y.Z release.
    name: Standalone host packages (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run test:host
      - run: bun run host:package --all
        if: runner.os == 'Linux'
      - run: bun run host:package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error

  publish:
    name: Publish native preview and its update feed
    needs: [build, rpm, host]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: native-dist
      - uses: actions/download-artifact@v8
        with:
          name: host-packages
          path: host-packages
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gespan-gpui
          key: native-publication-verifier
      # The vX.Y.Z tag publishes into the vX.Y.Z release.
      - name: Select the version's shared release
        run: node scripts/release-channel.cjs native-release-tag
      - name: Decide whether the versioned release still needs its packages
        run: |
          set -euo pipefail
          # Assigned on its own line: a prefix assignment is not visible to
          # expansions on the same command, so the plan never saw the release.
          RELEASE_JSON="$(gh release view "$NATIVE_RELEASE_TAG" --json isDraft,assets 2>/dev/null || true)"
          NATIVE_RELEASE_JSON="$RELEASE_JSON" \
            node scripts/release-channel.cjs native-publish-plan native-dist "$RUNNER_TEMP/native-packages.txt"
      - name: Recovery - reuse the published, already signed feed
        if: env.NATIVE_UPLOAD_PACKAGES == 'false'
        run: |
          set -euo pipefail
          # Nothing is signed here and the signing key is not in this step's
          # environment: the feed and signatures come from the published release and
          # are only checked for consistency.
          mkdir native-recovered
          gh release download "$NATIVE_RELEASE_TAG" --dir native-recovered --pattern native-latest.json --pattern '*.sig'
          node scripts/release-channel.cjs native-verify-recovery native-recovered
      - name: Sign all update packages and the native manifest
        if: env.NATIVE_UPLOAD_PACKAGES == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A dry-run tag may have no CHANGELOG section.
          NATIVE_RELEASE_NOTES: ${{ inputs.dry_run && 'Dry run' || '' }}
        run: |
          echo "GESPAN_NATIVE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          GESPAN_NATIVE_VERSION="${GITHUB_REF_NAME#v}" node scripts/native-release.mjs native-dist
      - name: Verify the signed feed and all packages with the native client
        if: env.NATIVE_UPLOAD_PACKAGES == 'true'
        run: cargo run --locked --manifest-path crates/gespan-gpui/Cargo.toml -p gespan-core --example verify_native_update --profile native-dev -- native-dist
      - name: Check optional R2 mirror
        run: node scripts/release-channel.cjs native-r2
      - name: Publish native preview assets
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          GESPAN_NATIVE_VERSION="${GITHUB_REF_NAME#v}"
          echo "GESPAN_NATIVE_VERSION=$GESPAN_NATIVE_VERSION" >> "$GITHUB_ENV"
          # The packages go on vX.Y.Z.
          # NATIVE_RELEASE_FLAGS keeps a prerelease off releases/latest and puts
          # a stable release on it, which is what publishes the stable feed.
          # Published files are never replaced: when this build's files are
          # already there, only the native-latest feed is refreshed (this lets
          # a failed run recover). See releasePlan in scripts/release-channel.cjs.
          mkdir -p "$RUNNER_TEMP/native-feed"
          if [ "$NATIVE_UPLOAD_PACKAGES" = true ]; then
            cp native-dist/latest.json "$RUNNER_TEMP/native-feed/latest.json"
            # The versioned release keeps the signed feed under its own name.
            cp native-dist/latest.json native-dist/native-latest.json
            node --input-type=module -e 'import { readFileSync } from "node:fs"; for (const file of JSON.parse(readFileSync("native-dist/release-files.json"))) console.log(file);' > "$RUNNER_TEMP/native-files.txt"
          else
            cp native-recovered/native-latest.json "$RUNNER_TEMP/native-feed/latest.json"
          fi
          if [ "$NATIVE_CREATE_RELEASE" = true ]; then
            node scripts/release-channel.cjs release-notes "$GESPAN_NATIVE_VERSION" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$NATIVE_RELEASE_TAG" --draft $NATIVE_RELEASE_FLAGS --target "$GITHUB_SHA" --title "Gespan ${GESPAN_NATIVE_VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          if [ "$NATIVE_UPLOAD_PACKAGES" = true ]; then
            FILES=()
            while IFS= read -r file; do
              FILES+=("native-dist/$file")
            done < "$RUNNER_TEMP/native-files.txt"
            # The signed feed rides along so a failed run can republish it unsigned.
            FILES+=(native-dist/native-latest.json)
            gh release upload "$NATIVE_RELEASE_TAG" "${FILES[@]}" --clobber
          fi
          # On the draft before it goes public, so a failure here publishes nothing.
          # Published files are never replaced, so a rerun only adds missing ones.
          EXISTING="$(gh release view "$NATIVE_RELEASE_TAG" --json assets --jq '.assets[].name')"
          HOST_FILES=()
          for file in host-packages/*; do
            grep -qxF "$(basename "$file")" <<<"$EXISTING" || HOST_FILES+=("$file")
          done
          if (( ${#HOST_FILES[@]} )); then
            gh release upload "$NATIVE_RELEASE_TAG" "${HOST_FILES[@]}"
          fi
          if [ "$NATIVE_UPLOAD_PACKAGES" = true ]; then
            # Publish a draft; a prerelease the other app already published keeps
            # its title, notes and channel.
            if [ "$NATIVE_PRERELEASE" = false ] || [ "$(gh release view "$NATIVE_RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$NATIVE_RELEASE_TAG" --draft=false $NATIVE_RELEASE_FLAGS
            fi
          fi
          # The feed references the assets of the versioned release above, so
          # the fixed native-latest release only ever holds this one feed file.
          # Publish it after every platform asset exists. A stable release needs
          # none of this: its native-latest.json is the stable feed.
          if [ "$NATIVE_PRERELEASE" = true ]; then
            if ! gh release view native-latest >/dev/null 2>&1; then
              gh release create native-latest --prerelease --latest=false --target "$GITHUB_SHA" --title "Update feed: Gespan Native (do not delete)" --notes 'This is not a release. It holds only latest.json, the signed update feed that installed Gespan Native builds check for new versions. Packages live on the vX.Y.Z releases.'
            fi
            gh release upload native-latest "$RUNNER_TEMP/native-feed/latest.json" --clobber
          fi
      - name: Mirror native preview to R2 (optional)
        if: env.R2_ENABLED == 'true' && env.NATIVE_UPLOAD_PACKAGES == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS= read -r file; do
            aws s3 cp "native-dist/$file" "s3://${R2_BUCKET_NAME}/${NATIVE_MIRROR_PREFIX}/${GESPAN_NATIVE_VERSION}/$file" --cache-control 'public,max-age=31536000,immutable' --endpoint-url "$ENDPOINT"
          done < "$RUNNER_TEMP/native-files.txt"
          aws s3 cp native-dist/latest.json "s3://${R2_BUCKET_NAME}/${NATIVE_MIRROR_PREFIX}/latest.json" --content-type application/json --cache-control 'no-store,max-age=0,must-revalidate' --endpoint-url "$ENDPOINT"
          # Stable links for both Mac architectures. The CDN must never keep an
          # older release under these mutable names. Prereleases list nothing.
          node scripts/release-channel.cjs native-fixed-downloads | while read -r file key; do
            aws s3 cp "native-dist/$file" "s3://${R2_BUCKET_NAME}/$key" --cache-control 'no-store,max-age=0,must-revalidate' --endpoint-url "$ENDPOINT"
          done
