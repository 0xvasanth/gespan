name: Mobile development

# Development builds and updates for the mobile app (Expo project
# @gespan/gespan). EAS builds in its cloud, including the Rust transport via
# scripts/eas-build-pre-install.mjs, so the runner only reads the app config.
on:
  # Every push to main that touches the app publishes its JavaScript to the
  # development channels. Installed development builds with a matching native
  # fingerprint can open it from the dev launcher.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-development.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: development installs on registered devices; development-simulator is iOS Simulator only
        type: choice
        options: [development, development-simulator]
        default: development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    name: Publish development update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require an Expo access token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret from an Expo account with access to the @gespan/gespan project." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish
        working-directory: mobile
        run: |
          message="$(git log -1 --format=%s)"
          for channel in development development-simulator; do
            eas update --channel "$channel" --environment development --platform all \
              --message "$message" --non-interactive
          done

  build:
    name: Build ${{ inputs.profile }} (${{ inputs.platform }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Waits for the EAS build, so a failed build fails this run.
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ inputs.platform }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret from an Expo account with access to the @gespan/gespan project." >&2
            exit 1
          fi
          if [ "$PROFILE" = development-simulator ] && [ "$PLATFORM" != ios ]; then
            echo "development-simulator builds are iOS only; choose the ios platform." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        working-directory: mobile
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
