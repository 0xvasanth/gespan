[package]
name = "gespan-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Search the decision log by meaning with nomic-embed-text-v1.5 (fastembed).
nomic = ["dep:fastembed", "dep:ort", "dep:sherpa-onnx-sys"]

[dependencies]
serde.workspace = true
# Stored floats must reload exactly, or saved revisions stop matching.
serde_json = { workspace = true, features = ["float_roundtrip"] }
rusqlite.workspace = true
toasty = { workspace = true, features = ["migration"] }
toasty-core.workspace = true
toasty-driver-sqlite.workspace = true
# The decision log's vectors: `vec0`, compiled against the bundled SQLite
# above and registered on every connection (`orm::register_sqlite_vec`).
sqlite-vec.workspace = true
# Its embedding model's pinned files and their downloader.
gespan-models.workspace = true
# Nomic embeddings on the CPU, behind the `nomic` feature. Model files come
# from gespan-models, so no Hugging Face client. ort links no ONNX Runtime of
# its own (`alternative-backend`): the app has exactly one, the static
# onnxruntime sherpa-onnx-sys ships for dictation on every target, and
# `embed::nomic` hands its API to ort.
fastembed = { workspace = true, features = ["onnx"], optional = true }
ort = { workspace = true, features = ["alternative-backend", "std", "api-24"], optional = true }
sherpa-onnx-sys = { workspace = true, optional = true }
# The ORM driver wrapper implements Toasty's async driver traits.
async-trait.workspace = true
async-channel.workspace = true
shlex.workspace = true
url.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["std", "clock"] }
sha1.workspace = true
sha2.workspace = true
rand.workspace = true
regex.workspace = true
serde_path_to_error.workspace = true
zstd.workspace = true
toml.workspace = true
ureq = { workspace = true, features = ["default"] }
# Loopback only, so no TLS: OpenCode's client-hosted MCP socket.
tungstenite = { workspace = true, features = ["handshake"] }
webpki-roots.workspace = true
similar.workspace = true
unicode-width.workspace = true
unicode-normalization.workspace = true
gespan-mobile-link.workspace = true
gespan-tracker-secrets.workspace = true
gespan-tracker-client.workspace = true
gespan-board-store.workspace = true
quinn = { workspace = true, features = ["runtime-tokio", "rustls-ring"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { workspace = true, features = ["v4"] }
if-addrs.workspace = true
hostname.workspace = true
igd-next.workspace = true
natpmp.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# The live pane decodes JPEG pictures straight to BGRA (already under `image`).
zune-jpeg.workspace = true
rquickjs.workspace = true
semver = { workspace = true, features = ["serde"] }
minisign-verify.workspace = true
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
# Diagnostics: structured JSONL logs, crash files and the `log` bridge.
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi", "env-filter", "registry", "tracing-log"] }
tracing-appender.workspace = true
log.workspace = true
tracing-log = { workspace = true, features = ["log-tracer", "std"] }
# Worktree copies: copy-on-write where the disk has it, and `.worktreeinclude`.
reflink-copy.workspace = true
ignore.workspace = true
rayon.workspace = true
# Report an issue: the scrubber and the bundle zip.
gespan-redact.workspace = true
gespan-mcp-config.workspace = true
mcp-hub.workspace = true
gespan-browser.workspace = true
# Only for its models, registered as the Graph database kind.
gespan-graph.workspace = true
herdr-link.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
keyring = { workspace = true, features = ["windows-native"] }
rusty-leveldb.workspace = true
tempfile.workspace = true

# Exercise WebView2 storage fixtures on Linux and macOS too.
[target.'cfg(not(windows))'.dev-dependencies]
rusty-leveldb.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
gespan-tracker-secrets = { workspace = true, features = ["testing"] }
gespan-tracker-client = { workspace = true, features = ["testing"] }
tempfile.workspace = true
gespan-redact = { workspace = true, features = ["fixtures"] }
gespan-browser = { workspace = true, features = ["testing"] }
