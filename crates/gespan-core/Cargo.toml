[package]
workspace = "../gespan-gpui"
name = "gespan-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
async-channel = "2"
shlex = "2"
url = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.11"
rand = "0.10"
regex = "1"
zstd = "0.14"
toml = "1.1.8"
ureq = "2.12"
webpki-roots = "1.0.11"
similar = "3"
unicode-width = "0.2"
gespan-mobile-link = { path = "../mobile-link" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"
hostname = "0.4"
igd-next = "0.18"
natpmp = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rquickjs = "0.14.0"
semver = { version = "1", features = ["serde"] }
minisign-verify = "0.3"
tempfile = "3"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rusty-leveldb = "4"
tempfile = "3"

# Exercise WebView2 storage fixtures on Linux and macOS too.
[target.'cfg(not(windows))'.dev-dependencies]
rusty-leveldb = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
