id = "opencode"
version = 3
min_engine_version = 1
label = "OpenCode"
binary = "opencode"
install_dirs = [".opencode/bin"]
install_name = "OpenCode CLI"
login_hint = "opencode auth login"
family = "opencode"
usage = "opencode"
discovery_timeout = 60

[features]
side_threads = true
rewind = true
raw_slash_commands = false
attachments = true
permission_modes = true
text_turns = true

[features.steer]
ack_timeout = 30
