id = "cursor"
version = 4
min_engine_version = 1
label = "Cursor"
binary = "cursor-agent"
install_name = "Cursor CLI"
login_hint = "agent login"
family = "acp"
discovery_timeout = 15

[login]
sign_in = ["login"]
sign_out = ["logout"]

# One account, told apart by label only: the CLI keeps a single sign-in
# per machine whatever config directory it is given.
[accounts]

[features]
side_threads = true
rewind = false
raw_slash_commands = false
attachments = true
permission_modes = true
text_turns = true

[features.steer]
