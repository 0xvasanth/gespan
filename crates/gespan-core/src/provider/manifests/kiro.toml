id = "kiro"
version = 4
min_engine_version = 1
label = "Kiro CLI"
binary = "kiro-cli"
install_name = "Kiro CLI"
install_command = "curl -fsSL https://cli.kiro.dev/install | bash, then kiro-cli login"
login_hint = "kiro-cli login"
family = "acp"
usage = "kiro"
discovery_timeout = 30

[login]
sign_in = ["login"]
sign_out = ["logout"]

# One account, told apart by label only: the CLI keeps a single sign-in
# per machine whatever config directory it is given.
[accounts]

[features]
side_threads = true
rewind = false
raw_slash_commands = false
attachments = true
permission_modes = true
text_turns = true
