[package]
name = "gespan-tracker-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# Test seams for other crates' tests: `FakeProvider`, `Tickets::with_providers`
# and the `Connection` trait.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ureq = "2.12"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["escape-html"] }
gespan-tracker-secrets = { path = "../tracker-secrets" }

[dev-dependencies]
gespan-tracker-secrets = { path = "../tracker-secrets", features = ["testing"] }
proptest = "1"
tempfile = "3"
