[package]
name = "gespan-tracker-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# Test seams for other crates' tests: `FakeProvider`, `Tickets::with_providers`
# and the `Connection` trait.
testing = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["std", "clock"] }
ureq = { workspace = true, features = ["default"] }
pulldown-cmark.workspace = true
quick-xml = { workspace = true, features = ["escape-html"] }
gespan-tracker-secrets.workspace = true

[dev-dependencies]
gespan-tracker-secrets = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
