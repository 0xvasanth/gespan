[package]
name = "gespan-redact"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aho-corasick.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json.workspace = true

[features]
# The shared fixture loader, for other crates' tests.
fixtures = ["dep:serde"]

[dev-dependencies]
gespan-redact = { path = ".", features = ["fixtures"] }
proptest.workspace = true
