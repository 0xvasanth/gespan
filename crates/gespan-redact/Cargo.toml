[package]
name = "gespan-redact"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"

[features]
# The shared fixture loader, for other crates' tests.
fixtures = ["dep:serde"]

[dev-dependencies]
gespan-redact = { path = ".", features = ["fixtures"] }
proptest = "1"
