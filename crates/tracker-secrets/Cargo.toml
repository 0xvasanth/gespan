[package]
name = "gespan-tracker-secrets"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# An in-memory keychain for other crates' tests.
testing = []

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(not(any(target_os = "macos", windows, target_os = "linux")))'.dependencies]
keyring = { version = "3.6", default-features = false }

[dev-dependencies]
gespan-tracker-secrets = { path = ".", features = ["testing"] }
tempfile = "3"
