[package]
name = "mcp-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
rand = "0.10"
serde = "1"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "elicitation", "transport-streamable-http-server"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
ureq = { version = "2.12", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
