[package]
name = "mcp-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
http-body-util.workspace = true
rand.workspace = true
serde.workspace = true
rmcp = { workspace = true, features = ["server", "client", "elicitation", "auth", "reqwest-tls-no-provider", "transport-streamable-http-server"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
# OAuth discovery and token calls go over HTTPS; the ring provider matches the
# app's other TLS and needs no C toolchain beyond what it already builds.
rustls = { workspace = true, features = ["ring", "std"] }
url.workspace = true
ureq = { workspace = true, features = ["json", "tls"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
tempfile.workspace = true
