[package]
name = "gespan-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Gespan's browser module: a thin CDP client, the access policy and the agent's browser actions. Served to agents through the MCP hub."

[features]
# The fake CDP endpoint and `BrowserHost::for_tests`, for the app's own tests.
# Only ever enabled from a dev-dependency.
testing = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# The browser tables are Toasty models; the app opens and migrates them.
# `sqlite` is for the tests' in-memory database. Same pin as gespan-core.
toasty = { workspace = true, features = ["sqlite"] }
# The tests' in-memory database runs on a runtime of its own (`testing`).
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
uuid = { workspace = true, features = ["v4"] }
tungstenite = { workspace = true, features = ["handshake"] }
base64.workspace = true
url.workspace = true
sha2.workspace = true
hmac.workspace = true
toml.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp"] }

# The integration tests use the test doubles (`testing`) too.
[dev-dependencies]
gespan-browser = { path = ".", features = ["testing"] }
