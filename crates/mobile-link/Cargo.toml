[package]
name = "gespan-mobile-link"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
base64.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
pulldown-cmark.workspace = true
quinn = { workspace = true, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
x509-parser.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
