[package]
name = "gespan-gpui"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
# The app ships with search by meaning: the decision log's Nomic embedder.
default = ["nomic"]
nomic = ["gespan-core/nomic"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
gespan-core.workspace = true
gespan-redact.workspace = true
gespan-keep-awake.workspace = true
# The ticket tools' refusal rules, shared with the bridge.
gespan-tracker-client.workspace = true
# Dictation: the shared speech helper and its model downloads.
gespan-speech.workspace = true
gespan-models.workspace = true
pulldown-cmark = { workspace = true, features = ["default"] }
mermaid-rs-renderer.workspace = true
syntect = { workspace = true, features = ["default-fancy"] }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
unicode-properties = { workspace = true, features = ["general-category"] }
unicode-segmentation.workspace = true
chrono = { workspace = true, features = ["clock"] }
async-channel.workspace = true
base64.workspace = true
# Attachment chips build their thumbnail sprites directly.
image.workspace = true
# The terminal dock: PTY, VT parser and grid (as Zed's terminal uses).
alacritty_terminal.workspace = true
libc.workspace = true
rquickjs.workspace = true
# The file editor's native syntax: incremental parses, highlights, folds and
# syntax errors. Languages without a grammar here use the QuickJS fallback.
tree-sitter.workspace = true
tree-sitter-language.workspace = true
streaming-iterator.workspace = true
notify.workspace = true
similar.workspace = true
# Structured events into the log file `gespan_core::diagnostics` sets up.
tracing.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-css.workspace = true
tree-sitter-html.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-go.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-java.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-ruby.workspace = true
# Settings → Mobile draws the pairing code from the module matrix.
qrcode.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# A fake browser for the live pane's tests.
gespan-browser = { workspace = true, features = ["testing"] }
# Board tests use raw SQL to stand in for another connection or break a table.
rusqlite.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# Scale tests size the board seed (`SeedSpec`).
gespan-board-store.workspace = true
# Seeds a saved tracker credential without touching the real keychain.
gespan-tracker-secrets = { workspace = true, features = ["testing"] }
# Reading report bundles back in tests.
url.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }
# Test log capture: the real JSONL layer under a thread-local registry.
tracing-subscriber = { workspace = true, features = ["registry", "std", "fmt"] }

# The vendored renderer's backdrop-blur marker for frosted popovers.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple.workspace = true
# Pins the native traffic lights' spacing.
objc2 = { workspace = true, features = ["exception"] }
block2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "block2", "NSEvent", "NSApplication", "NSDockTile", "NSButton", "NSControl", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSView", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage"] }
raw-window-handle.workspace = true
objc2-web-kit = { workspace = true, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "block2"] }
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSGeometry", "NSData", "NSRange", "NSArray", "NSValue", "NSSet", "NSError", "NSBundle"] }
objc2-user-notifications.workspace = true
# libmalloc keeps freed large spans dirty, so startup and image churn stayed
# resident. mimalloc 3 retains churn the same way; the v2 feature pins 2.x.
mimalloc = { workspace = true, features = ["v2"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
raw-window-handle.workspace = true
wry.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
tray-icon.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { workspace = true, features = ["test-support", "runtime_shaders"] }
# Must match the parking_lot the vendored GPUI exposes in its API (0.12).
parking_lot.workspace = true
