# Experimental native builds resolve separately from the production Tauri app.
[workspace]
resolver = "2"
members = ["../monocode-core"]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = false

[profile.native-dev.package."*"]
opt-level = 1
