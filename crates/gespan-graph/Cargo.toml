[package]
name = "gespan-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Built under the root workspace now, and later under the gespan-gpui
# workspace too once gespan-core depends on it, so nothing here inherits from
# either workspace.
[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
