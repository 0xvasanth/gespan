[package]
name = "gespan-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# The store goes through Toasty (same pin as gespan-core, which registers
# these models as its Graph kind). Its SQLite driver links this rusqlite.
toasty = { workspace = true, features = ["sqlite", "migration"] }
toasty-core.workspace = true
toasty-driver-sqlite.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The check for unknown migrations before Toasty opens a file, and the
# plain connection tests use. The SQLite build is the same bundled one
# board-store uses.
rusqlite = { workspace = true, features = ["bundled", "cache", "hooks"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The query oracle only.
petgraph.workspace = true
tempfile.workspace = true
