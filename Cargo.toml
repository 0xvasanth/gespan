[workspace]
resolver = "2"
members = ["crates/mobile-link", "crates/keep-awake", "crates/gespan-redact", "crates/gespan-mcp-config", "crates/mcp-hub", "crates/tracker-secrets", "crates/tracker-client", "crates/board-store", "crates/gespan-models", "crates/gespan-speech"]
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-linux", "vendor/gpui-pre-windows", "crates/gespan-core", "crates/gespan-first-launch", "crates/gespan-gpui"]

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
